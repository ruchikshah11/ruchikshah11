name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ruchikshah11
          outputs: |
            dist/github-snake.svg?color_snake=%230078D4&color_dots=%23e6edf3,%23c2e3ff,%237fc0ff,%2300b4d8,%230078d4
            dist/github-snake-dark.svg?color_snake=%2300B4D8&color_dots=%230d1117,%230a3d5c,%23146a94,%230078d4,%2300b4d8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
